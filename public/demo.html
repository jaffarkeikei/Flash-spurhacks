<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Demo - Instant Cross-Border Payments</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }
    .container {
      max-width: 900px;
    }
    .demo-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .card {
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    .result-panel {
      display: none;
      margin-top: 2rem;
    }
    #transactionDetails {
      font-family: monospace;
      max-height: 300px;
      overflow-y: auto;
    }
    .status-badge {
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="demo-header">
      <h1><i class="fas fa-bolt text-primary"></i> Flash</h1>
      <p class="lead">Instant Cross-Border Payments Demo</p>
    </div>

    <!-- Demo Login Panel -->
    <div class="row mb-4">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">1. Authentication</h5>
          </div>
          <div class="card-body">
            <form id="demoLoginForm" class="row g-3">
              <div class="col-md-4">
                <label for="demoEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="demoEmail" value="demo@flashsettle.com" readonly>
              </div>
              <div class="col-md-4">
                <label for="demoPassword" class="form-label">Password</label>
                <input type="text" class="form-control" id="demoPassword" value="password123" readonly>
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Login</button>
              </div>
            </form>
            <div id="loginResult" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Payment Form Section -->
    <div class="row mb-4">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">2. Send Cross-Border Payment</h5>
          </div>
          <div class="card-body">
            <form id="demoPaymentForm">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="amount" class="form-label">Amount</label>
                  <div class="input-group">
                    <input type="number" min="1" step="1" class="form-control" id="amount" placeholder="100" value="100" required>
                    <select class="form-select" id="sourceCurrency" style="max-width: 100px;">
                      <option value="USD" selected>USD</option>
                      <option value="EUR">EUR</option>
                      <option value="GBP">GBP</option>
                      <option value="USDC">USDC</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Recipient Gets</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="convertedAmount" value="95.00" readonly>
                    <select class="form-select" id="targetCurrency" style="max-width: 100px;">
                      <option value="USD">USD</option>
                      <option value="EUR" selected>EUR</option>
                      <option value="GBP">GBP</option>
                      <option value="USDC">USDC</option>
                    </select>
                  </div>
                </div>
              </div>
              
              <div class="mb-3">
                <label for="recipientAddress" class="form-label">Recipient Address</label>
                <input type="text" class="form-control" id="recipientAddress" 
                  value="0x8ea67eda95f0d3237e79447b1b8f12efc59a9a6d934900faa3cf9a5e46d6c71b" required>
                <div class="form-text">Aptos blockchain address of the recipient</div>
              </div>
              
              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="fee" class="form-label">Fee</label>
                  <input type="text" class="form-control" id="fee" readonly value="0.50 USD (0.5%)">
                </div>
                <div class="col-md-6">
                  <label for="estimatedTime" class="form-label">Estimated Time</label>
                  <input type="text" class="form-control" id="estimatedTime" readonly value="< 1 second">
                </div>
              </div>
              
              <div class="d-grid gap-2">
                <button class="btn btn-primary" type="submit" id="sendMoneyBtn">Send Money</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Transaction Result Section -->
    <div class="row">
      <div class="col-md-12">
        <div class="card result-panel" id="resultPanel">
          <div class="card-header bg-success text-white">
            <h5 class="mb-0">3. Transaction Results</h5>
          </div>
          <div class="card-body">
            <div class="alert alert-success mb-4">
              <i class="fas fa-check-circle me-2"></i> Payment processed successfully!
            </div>
            
            <h6>Transaction Details:</h6>
            <pre id="transactionDetails" class="bg-light p-3 rounded"></pre>
            
            <div class="mt-4">
              <h6>Payment Status: <span class="badge bg-success status-badge" id="paymentStatus">Completed</span></h6>
              <div class="progress mt-2">
                <div class="progress-bar bg-success" role="progressbar" style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
            
            <div class="d-grid gap-2 mt-4">
              <button class="btn btn-primary" type="button" id="newTransactionBtn">Start New Transaction</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    // DOM Elements
    document.addEventListener('DOMContentLoaded', function() {
      const demoLoginForm = document.getElementById('demoLoginForm');
      const demoPaymentForm = document.getElementById('demoPaymentForm');
      const resultPanel = document.getElementById('resultPanel');
      const transactionDetails = document.getElementById('transactionDetails');
      const loginResult = document.getElementById('loginResult');
      const newTransactionBtn = document.getElementById('newTransactionBtn');
      
      // Store token
      let accessToken = '';
      
      // API Base URL
      const API_BASE_URL = '/api/v1';
      
      // Login form submission
      demoLoginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('demoEmail').value;
        const password = document.getElementById('demoPassword').value;
        
        loginResult.innerHTML = '<div class="alert alert-info">Logging in...</div>';
        
        try {
          const response = await fetch(`${API_BASE_URL}/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });
          
          const data = await response.json();
          
          if (response.ok && data.data && data.data.accessToken) {
            accessToken = data.data.accessToken;
            loginResult.innerHTML = '<div class="alert alert-success">Login successful! You can now send payments.</div>';
          } else {
            loginResult.innerHTML = `<div class="alert alert-danger">Login failed: ${data.error || 'Unknown error'}</div>`;
          }
        } catch (error) {
          console.error('Login error:', error);
          loginResult.innerHTML = '<div class="alert alert-danger">Login failed. Check server connection.</div>';
        }
      });
      
      // Payment form submission
      demoPaymentForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!accessToken) {
          alert('Please login first!');
          return;
        }
        
        const amount = document.getElementById('amount').value;
        const sourceCurrency = document.getElementById('sourceCurrency').value;
        const targetCurrency = document.getElementById('targetCurrency').value;
        const recipient = document.getElementById('recipientAddress').value;
        
        try {
          const response = await fetch(`${API_BASE_URL}/payments`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${accessToken}`
            },
            body: JSON.stringify({
              amount: parseFloat(amount),
              sourceCurrency,
              targetCurrency,
              recipient
            })
          });
          
          const data = await response.json();
          
          if (response.ok && data.data) {
            // Show transaction details
            resultPanel.style.display = 'block';
            
            // Scroll to results
            resultPanel.scrollIntoView({ behavior: 'smooth' });
            
            // Format and display transaction data
            const txDetails = {
              id: data.data.id,
              amount: `${amount} ${sourceCurrency}`,
              recipient: recipient,
              recipientGets: `${document.getElementById('convertedAmount').value} ${targetCurrency}`,
              fee: document.getElementById('fee').value,
              timestamp: new Date().toISOString(),
              status: 'completed',
              blockchainTxHash: data.data.transactionHash || 'tx_simulated_hash',
              onChainPaymentId: data.data.onChainPaymentId || 'payment_simulated_id'
            };
            
            transactionDetails.textContent = JSON.stringify(txDetails, null, 2);
          } else {
            alert(`Payment failed: ${data.error || 'Unknown error'}`);
          }
        } catch (error) {
          console.error('Payment error:', error);
          alert('Payment failed. Check server connection.');
        }
      });
      
      // New transaction button
      newTransactionBtn.addEventListener('click', function() {
        resultPanel.style.display = 'none';
        demoPaymentForm.reset();
        
        // Set default values
        document.getElementById('amount').value = '100';
        document.getElementById('convertedAmount').value = '95.00';
        document.getElementById('recipientAddress').value = '0x8ea67eda95f0d3237e79447b1b8f12efc59a9a6d934900faa3cf9a5e46d6c71b';
      });
      
      // Update converted amount when source amount or currencies change
      document.getElementById('amount').addEventListener('input', updateConvertedAmount);
      document.getElementById('sourceCurrency').addEventListener('change', updateConvertedAmount);
      document.getElementById('targetCurrency').addEventListener('change', updateConvertedAmount);
      
      function updateConvertedAmount() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const fee = amount * 0.005; // 0.5% fee
        document.getElementById('fee').value = `${fee.toFixed(2)} USD (0.5%)`;
        
        // Simple conversion (in real app would use exchange rates)
        let convertedAmount = amount - fee;
        const sourceCurrency = document.getElementById('sourceCurrency').value;
        const targetCurrency = document.getElementById('targetCurrency').value;
        
        // Apply mock exchange rates
        if (sourceCurrency !== targetCurrency) {
          const rates = {
            'USD-EUR': 0.95,
            'USD-GBP': 0.82,
            'USD-USDC': 1,
            'EUR-USD': 1.05,
            'EUR-GBP': 0.86,
            'EUR-USDC': 1.05,
            'GBP-USD': 1.22,
            'GBP-EUR': 1.16,
            'GBP-USDC': 1.22,
            'USDC-USD': 1,
            'USDC-EUR': 0.95,
            'USDC-GBP': 0.82
          };
          
          const rateKey = `${sourceCurrency}-${targetCurrency}`;
          if (rates[rateKey]) {
            convertedAmount = convertedAmount * rates[rateKey];
          }
        }
        
        document.getElementById('convertedAmount').value = convertedAmount.toFixed(2);
      }
    });
  </script>
</body>
</html>
