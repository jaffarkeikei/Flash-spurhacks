<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Globe -->
  <circle cx="300" cy="200" r="150" fill="none" stroke="#0d6efd" stroke-width="2"/>
  <path d="M300 50 L300 350 M150 200 L450 200" stroke="#0d6efd" stroke-width="2"/>
  <path d="M300 50 A150 150 0 0 1 300 350" stroke="#0d6efd" stroke-width="2"/>
  <path d="M300 50 A150 150 0 0 0 300 350" stroke="#0d6efd" stroke-width="2"/>
  
  <!-- Connection Lines -->
  <path d="M150 100 L450 300" stroke="#0d6efd" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M150 300 L450 100" stroke="#0d6efd" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Nodes -->
  <circle cx="150" cy="100" r="10" fill="#0d6efd"/>
  <circle cx="450" cy="300" r="10" fill="#0d6efd"/>
  <circle cx="150" cy="300" r="10" fill="#0d6efd"/>
  <circle cx="450" cy="100" r="10" fill="#0d6efd"/>
  
  <!-- Center Node -->
  <circle cx="300" cy="200" r="15" fill="#0d6efd"/>
  
  <!-- Connection Points -->
  <circle cx="300" cy="50" r="5" fill="#0d6efd"/>
  <circle cx="300" cy="350" r="5" fill="#0d6efd"/>
  <circle cx="150" cy="200" r="5" fill="#0d6efd"/>
  <circle cx="450" cy="200" r="5" fill="#0d6efd"/>
</svg> 