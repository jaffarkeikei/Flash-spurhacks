<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashSettle - Redirecting...</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .redirect-container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 3rem;
      height: 3rem;
    }
  </style>
</head>
<body>
  <div class="redirect-container">
    <div class="demo-header">
      <h1><i class="fas fa-bolt text-primary"></i> FlashSettle</h1>
      <p class="lead">Instant Cross-Border Payments</p>
    </div>
    
    <div class="card">
      <div class="card-body">
        <div class="spinner-border text-primary spinner mb-3" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <h5>Redirecting to Login...</h5>
        <p class="text-muted">Please wait while we redirect you to the login page.</p>
        <a href="/login.html" class="btn btn-primary">
          <i class="fas fa-sign-in-alt me-2"></i>Go to Login
        </a>
      </div>
    </div>
  </div>

  <script>
    // Auto-redirect to login page
    setTimeout(() => {
      window.location.href = '/login.html';
    }, 2000);
  </script>
</body>
</html>
