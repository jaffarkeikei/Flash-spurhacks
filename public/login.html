<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash - Login | Instant Cross-Border Payments</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        .logo-section {
            margin-bottom: 40px;
        }
        
        .logo-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .app-title {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .app-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 0;
        }
        
        .form-section {
            text-align: left;
            margin-bottom: 30px;
        }
        
        .form-control {
            border-radius: 12px;
            border: 2px solid #e1e5e9;
            padding: 15px 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .demo-info {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #dee2e6;
        }
        
        .demo-info h6 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .demo-credentials {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .demo-credentials strong {
            color: #495057;
            font-size: 14px;
        }
        
        .demo-credentials span {
            color: #6c757d;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .loading-spinner {
            display: none;
            margin-right: 8px;
        }
        
        .success-message {
            display: none;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            border: 2px solid #c3e6cb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .error-message {
            display: none;
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
            border: 2px solid #f5c6cb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 5px;
        }
        
        .password-field {
            position: relative;
        }
        
        .btn-passkey {
            width: 100%;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            margin-bottom: 16px;
            position: relative;
        }
        
        .btn-passkey:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.4);
        }
        
        .btn-passkey:disabled {
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }
        
        .passkey-icon {
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e2e8f0;
        }
        
        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 16px;
            color: #718096;
            font-size: 14px;
            font-weight: 500;
        }
        
        .passkey-message {
            background: linear-gradient(135deg, #e6fffa, #b2f5ea);
            color: #234e52;
            border: 2px solid #81e6d9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        
        .traditional-login {
            transition: all 0.3s ease;
        }
        
        .hidden {
            display: none !important;
        }
        
        .passkey-benefits {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin: 20px 0;
            padding: 16px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
        }
        
        .passkey-benefit {
            flex: 1;
        }
        
        .passkey-benefit i {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }
        
        .passkey-benefit small {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
        }
        
        .btn-link {
            background: none;
            border: none;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #5a67d8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <!-- <i class="fas fa-bolt"></i> -->
                     <img src="/img/flash_logo_3.png" alt="Flash" height="50">
                </div>
                <h1 class="app-title">Flash</h1>
                <p class="app-subtitle">Instant Cross-Border Payments</p>
            </div>
            
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle me-2"></i>Login successful! Redirecting...
            </div>
            
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-triangle me-2"></i>Login failed. Please try again.
            </div>
            
            <div class="passkey-message" id="passkeyMessage" style="display: none;">
                <i class="fas fa-fingerprint me-2"></i>Use your biometric authentication
            </div>
            
            <!-- Stellar Passkey Authentication Section -->
            <div id="passkeySection" style="display: none;">
                <button type="button" class="btn-passkey" id="passkeyBtn">
                    <i class="fas fa-fingerprint passkey-icon"></i>
                    <span id="passkeyBtnText">Sign in with TouchID/FaceID</span>
                    <span class="loading-spinner spinner-border spinner-border-sm" id="passkeySpinner"></span>
                </button>
                
                <div class="text-center mt-3">
                    <button type="button" class="btn-link" id="showTraditionalBtn">
                        <i class="fas fa-key me-2"></i>Use traditional login instead
                    </button>
                </div>
            </div>
            
            <!-- Traditional Login Form (Hidden by default) -->
            <div class="form-section traditional-login" id="traditionalLogin" style="display: none;">
                <div class="text-center mb-3">
                    <button type="button" class="btn-link" id="backToPasskeyBtn">
                        <i class="fas fa-arrow-left me-2"></i>Back to biometric login
                    </button>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" value="demo@flashsettle.com" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-field">
                            <input type="password" class="form-control" id="password" value="password123" required>
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login" id="loginBtn">
                        <span class="loading-spinner spinner-border spinner-border-sm" id="loadingSpinner"></span>
                        <i class="fas fa-sign-in-alt me-2"></i>Access Flash Dashboard
                    </button>
                </form>
                
                <!-- Demo Info -->
                <div class="demo-info">
                    <h6><i class="fas fa-info-circle me-2"></i>Demo Credentials</h6>
                    <div class="demo-credentials">
                        <strong>Email:</strong>
                        <span>demo@flashsettle.com</span>
                    </div>
                    <div class="demo-credentials">
                        <strong>Password:</strong>
                        <span>password123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/js/stellarPasskey.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize Stellar Passkey Auth
            const stellarAuth = new StellarPasskeyAuth();
            
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const passkeyMessage = document.getElementById('passkeyMessage');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const emailInput = document.getElementById('email');
            
            // Passkey elements
            const passkeySection = document.getElementById('passkeySection');
            const passkeyBtn = document.getElementById('passkeyBtn');
            const passkeyBtnText = document.getElementById('passkeyBtnText');
            const passkeySpinner = document.getElementById('passkeySpinner');
            const traditionalLogin = document.getElementById('traditionalLogin');
            
            // UI navigation elements
            const showTraditionalBtn = document.getElementById('showTraditionalBtn');
            const backToPasskeyBtn = document.getElementById('backToPasskeyBtn');
            
            // Check if passkeys are supported and show the option
            if (stellarAuth.isSupported) {
                console.log('✅ Stellar Passkeys supported - showing biometric login option');
                passkeySection.style.display = 'block';
                
                // Check if user has existing passkey
                const email = emailInput.value;
                const hasExistingPasskey = await stellarAuth.hasPasskey(email);
                
                if (hasExistingPasskey) {
                    passkeyBtnText.textContent = 'Sign in with TouchID/FaceID';
                    passkeyMessage.style.display = 'block';
                    passkeyMessage.innerHTML = '<i class="fas fa-fingerprint me-2"></i>Ready for biometric authentication';
                } else {
                    passkeyBtnText.textContent = 'Set up TouchID/FaceID';
                }
            } else {
                console.log('❌ Stellar Passkeys not supported in this browser');
                traditionalLogin.style.display = 'block';
            }
            
            // Handle navigation between passkey and traditional login
            showTraditionalBtn.addEventListener('click', function() {
                passkeySection.style.display = 'none';
                traditionalLogin.style.display = 'block';
                hideMessages();
            });
            
            backToPasskeyBtn.addEventListener('click', function() {
                traditionalLogin.style.display = 'none';
                passkeySection.style.display = 'block';
                hideMessages();
            });
            
            // Handle passkey authentication
            passkeyBtn.addEventListener('click', async function() {
                const email = emailInput.value;
                
                // Show loading state
                passkeyBtn.disabled = true;
                passkeySpinner.style.display = 'inline-block';
                passkeyBtnText.textContent = 'Authenticating...';
                hideMessages();
                
                try {
                    // Check if user has existing passkey
                    const hasExistingPasskey = await stellarAuth.hasPasskey(email);
                    
                    if (hasExistingPasskey) {
                        // Authenticate with existing passkey
                        passkeyMessage.style.display = 'block';
                        passkeyMessage.innerHTML = '<i class="fas fa-fingerprint me-2"></i>Touch sensor or look at camera for Face ID...';
                        
                        const authResult = await stellarAuth.authenticatePasskey(email);
                        
                        if (authResult.success) {
                            // Store authentication data
                            localStorage.setItem('flashsettle_token', authResult.accessToken);
                            localStorage.setItem('flashsettle_user', JSON.stringify(authResult.user));
                            localStorage.setItem('flashsettle_auth_method', 'stellar_passkey');
                            if (authResult.refreshToken) {
                                localStorage.setItem('flashsettle_refresh_token', authResult.refreshToken);
                            }
                            
                            // Debug: verify token is stored
                            console.log('✅ Passkey login token stored:', authResult.accessToken);
                            
                            // Show success message
                            successMessage.style.display = 'block';
                            successMessage.innerHTML = '<i class="fas fa-check-circle me-2"></i>Stellar Passkey authentication successful! Redirecting...';
                            
                            // Redirect after short delay
                            setTimeout(() => {
                                window.location.href = '/dashboard.html';
                            }, 1500);
                        }
                    } else {
                        // Register new passkey
                        passkeyMessage.style.display = 'block';
                        passkeyMessage.innerHTML = '<i class="fas fa-fingerprint me-2"></i>Setting up your Stellar Passkey...';
                        
                        const userInfo = {
                            email: email,
                            name: email.split('@')[0]
                        };
                        
                        const registerResult = await stellarAuth.registerPasskey(userInfo);
                        
                        if (registerResult.success) {
                            // Store passkey registration
                            stellarAuth.storePasskeyRegistration(email);
                            
                            successMessage.style.display = 'block';
                            successMessage.innerHTML = '<i class="fas fa-check-circle me-2"></i>TouchID/FaceID setup complete! You can now use biometric login.';
                            
                            // Update button text for future logins
                            passkeyBtnText.textContent = 'Sign in with TouchID/FaceID';
                            
                            // Auto-login after registration
                            setTimeout(async () => {
                                try {
                                    const authResult = await stellarAuth.authenticatePasskey(email);
                                    if (authResult.success) {
                                        localStorage.setItem('flashsettle_token', authResult.accessToken);
                                        localStorage.setItem('flashsettle_user', JSON.stringify(authResult.user));
                                        localStorage.setItem('flashsettle_auth_method', 'stellar_passkey');
                                        
                                        window.location.href = '/dashboard.html';
                                    }
                                } catch (error) {
                                    console.error('Auto-login failed:', error);
                                    // Just update the UI, don't show error since registration was successful
                                    passkeyMessage.innerHTML = '<i class="fas fa-check-circle me-2"></i>Setup complete! Click the button above to sign in.';
                                }
                            }, 2000);
                        }
                    }
                    
                } catch (error) {
                    console.error('Passkey authentication failed:', error);
                    errorMessage.style.display = 'block';
                    errorMessage.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>Passkey authentication failed. Please try again or use traditional login.';
                } finally {
                    // Reset button state
                    passkeyBtn.disabled = false;
                    passkeySpinner.style.display = 'none';
                    passkeyBtnText.textContent = 'Sign in with TouchID/FaceID';
                }
            });
            
            // Toggle password visibility
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const icon = this.querySelector('i');
                if (type === 'password') {
                    icon.className = 'fas fa-eye';
                } else {
                    icon.className = 'fas fa-eye-slash';
                }
            });
            
            // Handle traditional login form submission
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = emailInput.value;
                const password = passwordInput.value;
                
                // Show loading state
                loginBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                hideMessages();
                
                try {
                    // Make API call to login
                    const response = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        // Store authentication data
                        localStorage.setItem('flashsettle_token', data.data.accessToken);
                        localStorage.setItem('flashsettle_user', JSON.stringify(data.data.user));
                        localStorage.setItem('flashsettle_auth_method', 'traditional');
                        
                        // Debug: verify token is stored
                        console.log('✅ Traditional login token stored:', data.data.accessToken);
                        
                        // Show success message
                        successMessage.style.display = 'block';
                        
                        // Redirect after short delay
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 1500);
                        
                    } else {
                        throw new Error(data.error || 'Login failed');
                    }
                    
                } catch (error) {
                    console.error('Login error:', error);
                    errorMessage.style.display = 'block';
                    
                    // Reset form state
                    loginBtn.disabled = false;
                    loadingSpinner.style.display = 'none';
                }
            });
            
            // Helper function to hide all messages
            function hideMessages() {
                successMessage.style.display = 'none';
                errorMessage.style.display = 'none';
                passkeyMessage.style.display = 'none';
            }
        });
    </script>
</body>

</html>
</html>
