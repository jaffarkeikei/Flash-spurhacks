<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash - Sign Up</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .signup-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        
        .signup-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        .logo-section {
            margin-bottom: 40px;
        }
        
        .logo-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .app-title {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .app-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 0;
        }
        
        .form-section {
            text-align: left;
            margin-bottom: 30px;
        }
        
        .form-control {
            border-radius: 12px;
            border: 2px solid #e1e5e9;
            padding: 15px 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .btn-signup {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }
        
        .btn-signup:active {
            transform: translateY(0);
        }
        
        .photo-section {
            margin-bottom: 30px;
        }
        
        .photo-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #e1e5e9;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            background: #f8f9fa;
        }
        
        .photo-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px dashed #dee2e6;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 24px;
        }
        
        .btn-camera {
            background: linear-gradient(135deg, #28a745, #20c997);
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-camera:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(40, 167, 69, 0.3);
            color: white;
        }
        
        .password-field {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 5px;
        }
        
        .back-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            display: inline-block;
        }
        
        .back-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <div class="signup-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1 class="app-title">Flash</h1>
                <p class="app-subtitle">Create Your Account</p>
            </div>
            
            <div class="form-section">
                <form id="signupForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-field">
                            <input type="password" class="form-control" id="password" required>
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="photo-section">
                        <label class="form-label">Profile Photo</label>
                        <div id="photoPreview" class="photo-placeholder">
                            <i class="fas fa-camera"></i>
                        </div>
                        <button type="button" class="btn-camera" id="takePhotoBtn">
                            <i class="fas fa-camera me-2"></i>Take Photo
                        </button>
                    </div>
                    
                    <button type="submit" class="btn-signup" id="signupBtn">
                        <i class="fas fa-user-plus me-2"></i>Create Account
                    </button>
                </form>
            </div>
            
            <a href="/login.html" class="back-link">
                <i class="fas fa-arrow-left me-2"></i>Back to Login
            </a>
        </div>
    </div>

    <!-- Camera Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1" aria-labelledby="cameraModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cameraModalLabel">
                        <i class="fas fa-camera me-2"></i>Take Profile Photo
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="camera-container">
                        <video id="cameraVideo" autoplay playsinline style="width: 100%; max-width: 500px; border-radius: 12px;"></video>
                        <canvas id="cameraCanvas" style="display: none;"></canvas>
                        <img id="capturedImage" style="display: none; width: 100%; max-width: 500px; border-radius: 12px;">
                    </div>
                    <div class="camera-controls mt-3">
                        <button type="button" class="btn btn-primary me-2" id="captureBtn">
                            <i class="fas fa-camera me-2"></i>Capture Photo
                        </button>
                        <button type="button" class="btn btn-secondary me-2" id="retakeBtn" style="display: none;">
                            <i class="fas fa-redo me-2"></i>Retake
                        </button>
                        <button type="button" class="btn btn-success" id="saveBtn" style="display: none;">
                            <i class="fas fa-save me-2"></i>Save
                        </button>
                    </div>
                    <div class="camera-status mt-3">
                        <div class="alert alert-info" id="cameraStatus">
                            <i class="fas fa-info-circle me-2"></i>Position your face in the center of the frame
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signupForm = document.getElementById('signupForm');
            const signupBtn = document.getElementById('signupBtn');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const takePhotoBtn = document.getElementById('takePhotoBtn');
            const photoPreview = document.getElementById('photoPreview');
            
            let capturedPhotoData = null;
            
            // Toggle password visibility
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const icon = this.querySelector('i');
                if (type === 'password') {
                    icon.className = 'fas fa-eye';
                } else {
                    icon.className = 'fas fa-eye-slash';
                }
            });
            
            // Take Photo button click handler
            takePhotoBtn.addEventListener('click', function() {
                cameraModal.show();
            });
            
            // Camera functionality
            const cameraModal = new bootstrap.Modal(document.getElementById('cameraModal'));
            const cameraVideo = document.getElementById('cameraVideo');
            const cameraCanvas = document.getElementById('cameraCanvas');
            const capturedImage = document.getElementById('capturedImage');
            const captureBtn = document.getElementById('captureBtn');
            const retakeBtn = document.getElementById('retakeBtn');
            const saveBtn = document.getElementById('saveBtn');
            const cameraStatus = document.getElementById('cameraStatus');
            
            let stream = null;
            
            // Initialize camera when modal opens
            document.getElementById('cameraModal').addEventListener('show.bs.modal', async function() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'user'
                        } 
                    });
                    cameraVideo.srcObject = stream;
                    cameraStatus.innerHTML = '<i class="fas fa-info-circle me-2"></i>Position your face in the center of the frame';
                } catch (error) {
                    console.error('Camera access error:', error);
                    cameraStatus.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>Camera access denied. Please allow camera permissions.';
                }
            });
            
            // Stop camera when modal closes
            document.getElementById('cameraModal').addEventListener('hidden.bs.modal', function() {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                // Reset UI
                cameraVideo.style.display = 'block';
                capturedImage.style.display = 'none';
                captureBtn.style.display = 'inline-block';
                retakeBtn.style.display = 'none';
                saveBtn.style.display = 'none';
                cameraStatus.innerHTML = '<i class="fas fa-info-circle me-2"></i>Position your face in the center of the frame';
            });
            
            // Capture photo
            captureBtn.addEventListener('click', function() {
                const context = cameraCanvas.getContext('2d');
                cameraCanvas.width = cameraVideo.videoWidth;
                cameraCanvas.height = cameraVideo.videoHeight;
                
                // Draw video frame to canvas
                context.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);
                
                // Convert to base64
                capturedPhotoData = cameraCanvas.toDataURL('image/jpeg', 0.8);
                
                // Display captured image
                capturedImage.src = capturedPhotoData;
                cameraVideo.style.display = 'none';
                capturedImage.style.display = 'block';
                
                // Update buttons
                captureBtn.style.display = 'none';
                retakeBtn.style.display = 'inline-block';
                saveBtn.style.display = 'inline-block';
                
                cameraStatus.innerHTML = '<i class="fas fa-check-circle me-2"></i>Photo captured! You can retake if needed.';
            });
            
            // Retake photo
            retakeBtn.addEventListener('click', function() {
                cameraVideo.style.display = 'block';
                capturedImage.style.display = 'none';
                captureBtn.style.display = 'inline-block';
                retakeBtn.style.display = 'none';
                saveBtn.style.display = 'none';
                capturedPhotoData = null;
                cameraStatus.innerHTML = '<i class="fas fa-info-circle me-2"></i>Position your face in the center of the frame';
            });
            
            // Save photo
            saveBtn.addEventListener('click', function() {
                if (capturedPhotoData) {
                    // Update photo preview
                    photoPreview.innerHTML = `<img src="${capturedPhotoData}" class="photo-preview" alt="Profile Photo">`;
                    cameraModal.hide();
                }
            });
            
            // Handle signup form submission
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                if (!capturedPhotoData) {
                    alert('Please take a profile photo before creating your account.');
                    return;
                }
                
                // Here you would typically send the data to your backend
                console.log('Signup data:', {
                    username: username,
                    password: password,
                    photo: capturedPhotoData ? 'Photo captured' : 'No photo'
                });
                
                // For now, just show success and redirect
                alert('Account created successfully!');
                window.location.href = '/dashboard.html';
            });
        });
    </script>
</body>

</html>
