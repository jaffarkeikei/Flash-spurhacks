<!DOCTYPE html>
<html>
<head>
    <title>Gemini API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .result { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Gemini API Model Test</h1>
    
    <button onclick="testModel('gemini-pro')">Test gemini-pro</button>
    <button onclick="testModel('gemini-1.5-flash')">Test gemini-1.5-flash</button>
    <button onclick="testModel('gemini-1.5-pro')">Test gemini-1.5-pro</button>
    <button onclick="testModel('gemini-1.0-pro')">Test gemini-1.0-pro</button>
    
    <div id="results"></div>
    
    <script src="js/config.js"></script>
    <script>
        async function testModel(model) {
            const resultsDiv = document.getElementById('results');
            const apiKey = window.ENV_CONFIG?.VITE_GEMINI_API_KEY || 'AIzaSyBuj4tPNhKXgSRg3RqpZEeM375PWvUfa_E';
            
            resultsDiv.innerHTML += `<div class="result">Testing model: <b>${model}</b>...</div>`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "Say hello"
                            }]
                        }]
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsDiv.innerHTML += `<div class="result success">✅ ${model} works! Response: ${JSON.stringify(data).substring(0, 100)}...</div>`;
                } else {
                    resultsDiv.innerHTML += `<div class="result error">❌ ${model} failed: ${response.status} - ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML += `<div class="result error">❌ ${model} error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
